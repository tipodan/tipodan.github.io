<style>
    .top3 {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: 20px;
        margin-bottom: 30px;
    }
    .top3-item {
        text-align: center;
    }
    .top3-item .medal {
        font-size: 28px;
        display: block;
        margin-bottom: 4px;
    }
    .top3-item .top3-logo {
        width: 32px;
        height: 32px;
        object-fit: contain;
        display: inline-block;
        margin-bottom: 4px;
    }
    .top3-item .top3-name {
        font-family: Montserrat, sans-serif;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        display: block;
    }
    .top3-item .top3-count {
        font-family: 'Crimson Text', Georgia, serif;
        font-size: 13px;
        color: #666;
    }
    .top3-item.first .medal { font-size: 36px; }
    .top3-item.first .top3-logo { width: 40px; height: 40px; }
    .top3-item.first .top3-name { font-size: 14px; }

    /* Horizontal bar chart */
    .bar-chart {
        width: 100%;
        max-width: 600px;
        margin: 0 auto;
    }
    .bar-row {
        display: flex;
        align-items: center;
        margin-bottom: 10px;
        gap: 8px;
    }
    .bar-logo {
        width: 20px;
        height: 20px;
        object-fit: contain;
        flex-shrink: 0;
    }
    .bar-name {
        font-family: Montserrat, sans-serif;
        font-size: 11px;
        font-weight: 600;
        width: 110px;
        flex-shrink: 0;
        text-align: right;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .bar-track {
        flex: 1;
        height: 22px;
        background: #f0f0f0;
        border-radius: 4px;
        overflow: hidden;
        position: relative;
    }
    .bar-fill {
        height: 100%;
        border-radius: 4px;
        transition: width 0.6s ease;
        min-width: 2px;
    }
    .bar-value {
        font-family: 'Crimson Text', Georgia, serif;
        font-size: 12px;
        color: #444;
        flex-shrink: 0;
        width: 62px;
        text-align: left;
    }

    /* Responsive adjustments */
    @media (max-width: 480px) {
        .bar-name {
            width: 80px;
            font-size: 10px;
        }
        .bar-logo {
            width: 16px;
            height: 16px;
        }
        .bar-value {
            font-size: 11px;
            width: 54px;
        }
        .top3 {
            gap: 12px;
        }
        .top3-item .top3-name {
            font-size: 10px;
        }
        .top3-item .top3-count {
            font-size: 11px;
        }
    }

    #contact h2 {
        font-size: 17.5px;
        font-style: italic;
        font-weight: 400;
        margin-bottom: 14px;
        margin-top: 30px;
        text-align: center;
    }
    #contact h2:first-child {
        margin-top: 0;
    }
</style>

					</li>

			<div id="contact" class="section">
                <h1 style="font-size:24px;font-weight:700;font-family:Montserrat,sans-serif;text-transform:uppercase;margin-bottom:24px;text-align:center">Airlines</h1>

<script src="../files/jquery.min.js"></script>
<script src="../files/jquery.flexslider-min.js"></script>
<script src="../files/script.js"></script>
<script src="../files/modernizr.custom.js"></script>
<script src="../files/flights-data.js"></script>
<script>
(function() {
    var flights = FLIGHTS_DATA;
    var total = flights.length;

    // Airline local logo paths
    var airlineLogos = {
        'Ryanair': '../flights/logos/ryanair.png',
        'Iberia': '../flights/logos/iberia.png',
        'Norwegian': '../flights/logos/norwegian.png',
        'Turkish Airlines': '../flights/logos/turkish-airlines.png',
        'Air Berlin': '../flights/logos/air-berlin.png',
        'KLM': '../flights/logos/klm.png',
        'Binter Canarias': '../flights/logos/binter-canarias.png',
        'Air Europa': '../flights/logos/air-europa.png',
        'S7 Airlines': '../flights/logos/s7.png',
        'Iberia Express': '../flights/logos/iberia-express.png',
        'Delta': '../flights/logos/delta.png',
        'TAP Air Portugal': '../flights/logos/tap.png',
        'EasyJet': '../flights/logos/easyjet.png',
        'Spanair': '../flights/logos/spanair.png',
        'Vueling': '../flights/logos/vueling.png',
        'KLM Cityhopper': '../flights/logos/klm.png',
        'Saudia': '../flights/logos/saudia.png',
        'Air Asia': '../flights/logos/airasia.png',
        'Emirates': '../flights/logos/emirates.png'
    };

    // Airline brand colors
    var airlineColors = {
        'Ryanair': '#073590',
        'Iberia': '#d81e05',
        'Norwegian': '#d81939',
        'Turkish Airlines': '#c8102e',
        'Air Berlin': '#e30613',
        'KLM': '#00a1de',
        'Binter Canarias': '#00a651',
        'Air Europa': '#003b73',
        'S7 Airlines': '#8bc541',
        'Iberia Express': '#d81e05',
        'Delta': '#003366',
        'TAP Air Portugal': '#00956b',
        'EasyJet': '#ff6600',
        'Spanair': '#003580',
        'Vueling': '#ffcd02',
        'KLM Cityhopper': '#00a1de',
        'Saudia': '#006633',
        'Air Asia': '#e42421',
        'Emirates': '#c8102e'
    };

    var airlines = {};
    flights.forEach(function(f) {
        var a = f['Compañía'];
        airlines[a] = (airlines[a] || 0) + 1;
    });

    var sortedAirlines = Object.entries(airlines).sort(function(a, b) { return b[1] - a[1]; });
    var labels = sortedAirlines.map(function(e) { return e[0]; });
    var data = sortedAirlines.map(function(e) { return e[1]; });
    var maxCount = data[0];

    // Top 3 podium
    var medals = ['🥇', '🥈', '🥉'];
    var top3El = document.getElementById('top3');
    var order = [1, 0, 2]; // display: 2nd, 1st, 3rd
    order.forEach(function(idx) {
        if (idx >= sortedAirlines.length) return;
        var name = labels[idx];
        var count = data[idx];
        var pct = ((count / total) * 100).toFixed(1);
        var logoSrc = airlineLogos[name] || '';
        var div = document.createElement('div');
        div.className = 'top3-item' + (idx === 0 ? ' first' : '');
        div.innerHTML =
            '<span class="medal">' + medals[idx] + '</span>' +
            (logoSrc ? '<img class="top3-logo" src="' + logoSrc + '" alt="">' : '') +
            '<span class="top3-name">' + name + '</span>' +
            '<span class="top3-count">' + count + ' flights (' + pct + '%)</span>';
        top3El.appendChild(div);
    });

    // Horizontal bar chart
    var barChart = document.getElementById('barChart');
    labels.forEach(function(name, i) {
        var count = data[i];
        var pct = ((count / total) * 100).toFixed(1);
        var widthPct = ((count / maxCount) * 100).toFixed(1);
        var color = airlineColors[name] || '#999999';
        var logoSrc = airlineLogos[name] || '';

        var row = document.createElement('div');
        row.className = 'bar-row';
        row.innerHTML =
            (logoSrc ? '<img class="bar-logo" src="' + logoSrc + '" alt="">' : '<span class="bar-logo"></span>') +
            '<span class="bar-name">' + name + '</span>' +
            '<div class="bar-track"><div class="bar-fill" style="width:' + widthPct + '%;background-color:' + color + '"></div></div>' +
            '<span class="bar-value">' + count + ' (' + pct + '%)</span>';
        barChart.appendChild(row);
    });
})();
</script>
