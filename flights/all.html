<style>
    .flights-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
        margin-bottom: 30px;

    .flights-table th,
    .flights-table td {
        text-align: left;
        padding: 6px 10px;

    .flights-table th {
        font-family: Montserrat, sans-serif;
        font-size: 11px;
        text-transform: uppercase;
        font-weight: 700;
        border-bottom: 2px solid #333;
        cursor: pointer;
        user-select: none;
    }
    .flights-table th:hover {
        color: #666;
    }
    .flights-table th .sort-arrow {
        margin-left: 4px;
        font-size: 10px;
    }
    .flights-table tr:hover {
        background-color: #f9f9f9;
    }
    .flights-table td.clickable {
        cursor: pointer;
    }
    .flights-table td.clickable:hover {
        text-decoration: underline;
        color: #333;
    }
    .stats-summary {
        font-size: 15px;
        margin-bottom: 20px;
        line-height: 1.6;
    }
    .stats-summary strong {
        font-size: 15px;
        text-transform: none;
    }
    .filter-bar {
        font-size: 13px;
        margin-bottom: 14px;
        padding: 8px 12px;
        background: #f5f5f5;
        border-radius: 3px;
        display: none;
    }
    .filter-bar .filter-text {
        margin-right: 10px;
    }
    .filter-bar .clear-filter {
        cursor: pointer;
        font-family: Montserrat, sans-serif;
        font-size: 11px;
        text-transform: uppercase;
        font-weight: 700;
        color: #c0392b;
    }
    .filter-bar .clear-filter:hover {
        text-decoration: underline;
    }
</style>

<script src="../files/jquery.min.js"></script>
<script src="../files/jquery.flexslider-min.js"></script>
<script src="../files/script.js"></script>
<script src="../files/modernizr.custom.js"></script>
<script src="../files/flights-data.js"></script>
<script>
(function() {
    var flights = FLIGHTS_DATA;
    var total = flights.length;

    var airlineLogos = {
        'Ryanair': '../flights/logos/ryanair.png',
        'Iberia': '../flights/logos/iberia.png',
        'Norwegian': '../flights/logos/norwegian.png',
        'Turkish Airlines': '../flights/logos/turkish-airlines.png',
        'Air Berlin': '../flights/logos/air-berlin.png',
        'KLM': '../flights/logos/klm.png',
        'Binter Canarias': '../flights/logos/binter-canarias.png',
        'Air Europa': '../flights/logos/air-europa.png',
        'S7 Airlines': '../flights/logos/s7.png',
        'Iberia Express': '../flights/logos/iberia-express.png',
        'Delta': '../flights/logos/delta.png',
        'TAP Air Portugal': '../flights/logos/tap.png',
        'EasyJet': '../flights/logos/easyjet.png',
        'Spanair': '../flights/logos/spanair.png',
        'Vueling': '../flights/logos/vueling.png',
        'KLM Cityhopper': '../flights/logos/klm.png',
        'Saudia': '../flights/logos/saudia.png',
        'Air Asia': '../flights/logos/airasia.png',
        'Emirates': '../flights/logos/emirates.png'
    };

    var destinations = {};
    flights.forEach(function(f) {
        destinations[f['Llegada']] = true;
        destinations[f['Salida']] = true;
    });
    var airlinesSet = {};
    flights.forEach(function(f) {
        airlinesSet[f['Compañía']] = true;
    });

    document.getElementById('summary').innerHTML =
        '<strong>' + total + '</strong> flights taken since 1994 · ' +
        '<strong>' + Object.keys(destinations).length + '</strong> cities · ' +
        '<strong>' + Object.keys(airlinesSet).length + '</strong> airlines';

    // State
    var currentSort = { col: 'date', dir: 'asc' };
    var currentFilter = null; // { type: 'airline'|'year'|'route'|'airport', value: '...' }

    function getDateValue(f) {
        return f['Fecha'] || (f['Año'] + '-01-01');
    }

    function getSortValue(f, col) {
        switch(col) {
            case 'route': return f['Vuelo'];
            case 'from': return f['Salida'];
            case 'to': return f['Llegada'];
            case 'date': return getDateValue(f);
            case 'airline': return f['Compañía'];
            default: return '';
        }
    }

    function applyFilter(data) {
        if (!currentFilter) return data;
        return data.filter(function(f) {
            switch(currentFilter.type) {
                case 'airline': return f['Compañía'] === currentFilter.value;
                case 'year': return String(f['Año']) === currentFilter.value;
                case 'route': return f['Vuelo'] === currentFilter.value;
                case 'airport': return f['Salida AER'] === currentFilter.value || f['Llegada AER'] === currentFilter.value;
                default: return true;
            }
        });
    }

    function updateFilterBar() {
        var bar = document.getElementById('filterBar');
        var text = document.getElementById('filterText');
        if (currentFilter) {
            var label = '';
            switch(currentFilter.type) {
                case 'airline': label = 'Airline: ' + currentFilter.value; break;
                case 'year': label = 'Year: ' + currentFilter.value; break;
                case 'route': label = 'Route: ' + currentFilter.value; break;
                case 'airport': label = 'Airport: ' + currentFilter.value; break;
            }
            text.textContent = label;
            bar.style.display = 'block';
        } else {
            bar.style.display = 'none';
        }
    }

    function renderTable() {
        var filtered = applyFilter(flights);
        var sorted = filtered.slice().sort(function(a, b) {
            var va = getSortValue(a, currentSort.col).toString().toLowerCase();
            var vb = getSortValue(b, currentSort.col).toString().toLowerCase();
            if (va < vb) return currentSort.dir === 'asc' ? -1 : 1;
            if (va > vb) return currentSort.dir === 'asc' ? 1 : -1;
            return 0;
        });

        var tbody = document.querySelector('#flightsTable tbody');
        tbody.innerHTML = '';
        sorted.forEach(function(f) {
            var tr = document.createElement('tr');
            var date = f['Fecha'] || f['Año'];
            var logoSrc = airlineLogos[f['Compañía']] || '';
            var logoImg = logoSrc ? '<img style="width:16px;height:16px;object-fit:contain;display:inline-block;vertical-align:middle;margin-right:6px" src="' + logoSrc + '" alt="">' : '';
            tr.innerHTML =
                '<td class="clickable" data-filter-type="route" data-filter-value="' + f['Vuelo'] + '">' + f['Vuelo'] + '</td>' +
                '<td class="clickable" data-filter-type="airport" data-filter-value="' + f['Salida AER'] + '">' + f['Salida'] + ' (' + f['Salida AER'] + ')</td>' +
                '<td class="clickable" data-filter-type="airport" data-filter-value="' + f['Llegada AER'] + '">' + f['Llegada'] + ' (' + f['Llegada AER'] + ')</td>' +
                '<td class="clickable" data-filter-type="year" data-filter-value="' + f['Año'] + '">' + date + '</td>' +
                '<td class="clickable" data-filter-type="airline" data-filter-value="' + f['Compañía'] + '" style="white-space:nowrap">' + logoImg + '<span style="vertical-align:middle">' + f['Compañía'] + '</span></td>';
            tbody.appendChild(tr);
        });

        // Attach cell click handlers
        tbody.querySelectorAll('td.clickable').forEach(function(td) {
            td.addEventListener('click', function() {
                var type = this.getAttribute('data-filter-type');
                var value = this.getAttribute('data-filter-value');
                // If clicking same filter, clear it
                if (currentFilter && currentFilter.type === type && currentFilter.value === value) {
                    currentFilter = null;
                } else {
                    currentFilter = { type: type, value: value };
                }
                updateFilterBar();
                renderTable();
            });
        });

        updateFilterBar();
    }

    function updateArrows() {
        var ths = document.querySelectorAll('#flightsTable th');
        ths.forEach(function(th) {
            var arrow = th.querySelector('.sort-arrow');
            var col = th.getAttribute('data-col');
            if (col === currentSort.col) {
                arrow.textContent = currentSort.dir === 'asc' ? '▲' : '▼';
            } else {
                arrow.textContent = '';
            }
        });
    }

    // Column header sort
    document.querySelectorAll('#flightsTable th').forEach(function(th) {
        th.addEventListener('click', function() {
            var col = this.getAttribute('data-col');
            if (currentSort.col === col) {
                currentSort.dir = currentSort.dir === 'asc' ? 'desc' : 'asc';
            } else {
                currentSort.col = col;
                currentSort.dir = 'asc';
            }
            renderTable();
            updateArrows();
        });
    });

    // Clear filter button
    document.getElementById('clearFilter').addEventListener('click', function() {
        currentFilter = null;
        updateFilterBar();
        renderTable();
    });

    // Initial render
    renderTable();
    updateArrows();
})();
</script>
